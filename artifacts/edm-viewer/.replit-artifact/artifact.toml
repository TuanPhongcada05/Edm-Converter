kind = "web"
previewPath = "/"
title = "EDM File Inspector"
version = "1.0.0"
id = "artifacts/edm-viewer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19124

[services.development]
run = "pnpm --filter @workspace/edm-viewer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edm-viewer", "run", "build" ]
publicDir = "artifacts/edm-viewer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19124"
BASE_PATH = "/"
